<!-- Projects Admin Modal -->
<div id="projectsAdminModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Admin Panel — Manage Projects</h2>
            <button class="close-button" id="closeProjectsAdminModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="admin-tabs">
                <button class="admin-tab-button active" data-admin-tab="list">Projects List</button>
                <button class="admin-tab-button" data-admin-tab="add">Add Project</button>
                <button class="admin-tab-button" data-admin-tab="edit">Edit Project</button>
            </div>

            <!-- Projects List Tab -->
            <div id="admin-list" class="admin-tab-content active">
                <div id="projectsList" class="projects-list"></div>
            </div>

            <!-- Add Project Tab -->
            <div id="admin-add" class="admin-tab-content">
                <form id="addProjectForm" class="project-form">
                    <h3>Add New Project</h3>
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" name="title" required placeholder="Project Title">
                    </div>
                    <div class="form-group">
                        <label>Metric (e.g. 95.1%):</label>
                        <input type="text" name="metric" placeholder="95.1%">
                    </div>
                    <div class="form-group">
                        <label>Metric Label (e.g. AUC Score):</label>
                        <input type="text" name="metricLabel" placeholder="AUC Score">
                    </div>
                    <div class="form-group">
                        <label>Description:</label>
                        <textarea name="description" required placeholder="Project description (shown on card)"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Second Paragraph (optional, featured project only):</label>
                        <textarea name="description2" placeholder="Additional detail for the featured project card"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated):</label>
                        <input type="text" name="tags" required placeholder="Python, Scikit-learn, Pandas">
                    </div>
                    <div class="form-group">
                        <label>GitHub URL:</label>
                        <input type="url" name="github" required placeholder="https://github.com/username/repo">
                    </div>
                    <button type="submit" class="btn-primary">Add Project</button>
                </form>
            </div>

            <!-- Edit Project Tab -->
            <div id="admin-edit" class="admin-tab-content">
                <div class="form-group">
                    <label>Select Project to Edit:</label>
                    <select id="editProjectSelect">
                        <option value="">-- Select a project --</option>
                    </select>
                </div>
                <form id="editProjectForm" class="project-form" style="display: none;">
                    <h3>Edit Project</h3>
                    <input type="hidden" name="id">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Metric:</label>
                        <input type="text" name="metric">
                    </div>
                    <div class="form-group">
                        <label>Metric Label:</label>
                        <input type="text" name="metricLabel">
                    </div>
                    <div class="form-group">
                        <label>Description:</label>
                        <textarea name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Second Paragraph (optional):</label>
                        <textarea name="description2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated):</label>
                        <input type="text" name="tags" required>
                    </div>
                    <div class="form-group">
                        <label>GitHub URL:</label>
                        <input type="url" name="github" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Update Project</button>
                        <button type="button" class="btn-danger" id="deleteProjectBtn">Delete Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
