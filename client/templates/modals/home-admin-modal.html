<!-- Home Admin Modal -->
<div id="homeAdminModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Content</h2>
            <button class="close-button" id="closeHomeAdminModal">&times;</button>
        </div>
        <div class="modal-body">
            <form id="homeEditForm" class="project-form">
                <h3>Hero Section</h3>
                <div class="form-group">
                    <label>Eyebrow Label:</label>
                    <input type="text" name="heroEyebrow" required placeholder="Data Scientist &amp; Analyst">
                </div>
                <div class="form-group">
                    <label>Tagline:</label>
                    <textarea name="heroTagline" required placeholder="Hi, I'm Sendija..."></textarea>
                </div>
                <div class="form-group">
                    <label>Skill Tags (comma-separated):</label>
                    <input type="text" name="heroSkillTags" required placeholder="Python, SQL, Power BI, Excel">
                </div>

                <h3>About Section</h3>
                <div class="form-group">
                    <label>About Body:</label>
                    <textarea name="aboutBody" required placeholder="Enter about text. Separate paragraphs with blank lines."></textarea>
                    <small>Separate paragraphs with blank lines (press Enter twice between paragraphs)</small>
                </div>

                <h3>Contact Section</h3>
                <div class="form-group">
                    <label>Contact Body:</label>
                    <textarea name="contactBody" required placeholder="Open to data analyst roles..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
